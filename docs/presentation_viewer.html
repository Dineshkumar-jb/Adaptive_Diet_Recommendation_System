<html lang="en">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 27, 45, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 45%);
    }

    /* Top Controls Bar */
    header {
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .slide-counter {
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Main Slide Stage */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1100px;
      height: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .slide-pill {
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 12px;
    }

    .slide-title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .slide-content {
      flex: 1;
      display: flex;
      gap: 20px;
      overflow-y: auto;
    }

    .card {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .card.highlight {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.04);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13.5px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .card ul li::before {
      content: "•";
      color: var(--accent);
      font-weight: bold;
      display: inline-block;
      width: 14px;
      margin-left: -14px;
    }

    pre {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #38bdf8;
      border: 1px solid var(--border);
      overflow-x: auto;
      line-height: 1.4;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }

    th, td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--accent);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
    }

    .text-success { color: var(--success); font-weight: bold; }
    .text-danger { color: var(--danger); font-weight: bold; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    /* Footer Navigation Indicator */
    footer {
      padding: 10px 24px;
      display: flex;
      justify-content: center;
      gap: 6px;
      background: rgba(9, 13, 22, 0.85);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dot.active {
      background: var(--accent);
      width: 24px;
      border-radius: 4px;
    }
  </style>
</head>

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      currentSlide = index;

      const slide = slides[index];
      const box = document.getElementById('slideBox');
      box.innerHTML = `
        <div class="slide-pill">${slide.pill}</div>
        <div class="slide-title">${slide.title}</div>
        <div class="slide-content">${slide.render()}</div>
      `;

      document.getElementById('slideNum').textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;

      // Update dots
      document.querySelectorAll('.dot').forEach((d, i) => {
        if (i === index) d.classList.add('active');
        else d.classList.remove('active');
      });
    }

    function prevSlide() { if (currentSlide > 0) renderSlide(currentSlide - 1); }
    function nextSlide() { if (currentSlide < slides.length - 1) renderSlide(currentSlide + 1); }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key.toLowerCase() === 'f') toggleFullScreen();
    });

    // Generate Dots
    const dotsContainer = document.getElementById('dotsContainer');
    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 0 ? 'active' : ''}`;
      dot.onclick = () => renderSlide(i);
      dotsContainer.appendChild(dot);
    });

    // Init
    renderSlide(0);
  </script>
